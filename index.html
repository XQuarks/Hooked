<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#04121f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="HOOKED · 一款模仿 Ridiculous Fishing 核心玩法的 Three.js 竖屏钓鱼游戏" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8E%A3%3C/text%3E%3C/svg%3E" />
<title>HOOKED · 荒谬钓鱼</title>
<link rel="stylesheet" href="./styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud" class="hud">
    <div class="topbar">
      <!-- 金币图标是内联 SVG（icons.js 注入），不是 emoji —— 见 icons.js 顶部说明 -->
      <div class="chip coin"><span class="ico" id="coinIco"></span><b id="coinVal">0</b></div>
      <div id="depthChip" class="chip depth"><span class="ico" id="depthIco"></span><b id="depthVal">0</b><i>/ <span id="lineVal">80</span>m</i></div>
      <!-- 静音按钮的内容由 ui.setMuteIcon() 在启动时注入 SVG，这里留空避免 emoji 闪一下 -->
      <button id="muteBtn" class="iconbtn" aria-label="声音"></button>
    </div>

    <div id="seaTitle" class="sea-title">
      <b id="seaName">宁静海湾</b>
      <span id="seaGoal">可下潜至 −430m</span>
    </div>

    <div id="zoneBanner" class="zone-banner">
      <b id="zoneName">表层</b><span id="zoneEn">SUNLIT</span>
    </div>

    <div id="ruler" class="ruler"></div>

    <div id="catchPanel" class="catch-panel">
      <div class="catch-head"><span>渔获</span><b id="catchCount">0</b></div>
      <div id="catchList" class="catch-list"></div>
    </div>

    <div id="comboBox" class="combo-box">
      <b id="comboVal">×1.0</b><span id="comboCnt">0 COMBO</span>
    </div>

    <div id="floatLayer" class="float-layer"></div>

    <!-- 枪械条：只在空中射击阶段出现。弹匣 / 换弹进度 / 激光过热都读这里 -->
    <div id="gunBar" class="gun-bar">
      <span class="gb-ico" id="gunIco"></span>
      <span class="gb-txt"><b id="gunName">普通手枪</b><i id="gunMeta">Lv.0</i></span>
      <span class="gb-ammo" id="gunAmmo"></span>
      <i class="gb-meter"><b id="gunMeter"></b></i>
    </div>

    <!-- 唯一的常驻入口：手机（商店 / 图鉴 / 设置 都在里面）。
         v0.7：按钮本体就是**一部小手机**（机身 + 屏幕 + 听筒 + HOME 条），
         不再是"图标 + 手 机"文字 —— 它一直在待机界面左下角，
         画成手机之后"点它能打开手机"不需要一个字来解释。见 styles.css 的 .phone-btn -->
    <button id="phoneBtn" class="phone-btn" aria-label="打开手机">
      <span class="ph-body"><i class="ph-notch"></i><span class="ph-screen" id="phoneIco"></span></span>
      <i class="ph-dot" id="phoneDot"></i>
    </button>
    <!-- 来电（v0.7）：模仿 iPhone 来电界面 —— 从屏幕上方滑入的来电卡
         （圆形头像 + 来电人 + 「来电中…」 + 挂断 / 接听两个圆钮）。
         点卡片本身 = 打开手机并直接进入来电界面；两个圆钮分别是忽略 / 接听。
         ⚠ 它仍然**不阻塞任何操作** —— 卡片以外照样能点画面抛竿（见 config 的 CALLS 四条硬约束）。 -->
    <div id="callBanner" class="ios-call">
      <span class="ios-ava" id="callBannerIco"></span>
      <span class="ios-txt"><b id="callBannerWho">来电</b><i id="iosState">来电中…</i></span>
      <span class="ios-btns">
        <button class="ios-btn decline" id="callDecline" aria-label="忽略"></button>
        <button class="ios-btn accept" id="callAccept" aria-label="接听"></button>
      </span>
    </div>
    <!-- 新货上架推送（v0.7 第三批）：模仿 iPhone 的推送通知 —— 一把枪从"锁着"变"可见"
         的那一刻从顶部滑入，点它直接打开枪店（红点就是在那一步消失的）。
         ⚠ 和来电卡一样**不阻塞操作**；自动收起之后红点仍留在手机上，直到玩家点开枪店。
         ⚠ 与来电共用一套视觉语言但不共用一张卡：来电要你做选择，推送只是"有新东西可看"，
           两者长一样的话玩家会开始害怕每一次震动。 -->
    <button id="newsBanner" class="ios-news" aria-label="枪店新货上架">
      <span class="ios-ava news-ava" id="newsIco"></span>
      <span class="ios-txt"><b id="newsTitle">枪店 · 新货上架</b><i id="newsBody"></i></span>
      <span class="ios-now">现在</span>
    </button>
    <button id="reelBtn" class="reel-btn">收线 <span>▲</span></button>
    <!-- 快速回收（绞盘，v0.5）：只在**上升阶段 + 已买绞盘**时出现。
         按一下 = 本竿剩下的上升段全速收线（见 config 的 FAST_REEL_MUL）。
         图标由 ui._fillIcons() 注入 SVG，这里留空避免 emoji 闪一下。 -->
    <button id="fastReelBtn" class="fast-reel-btn"><span class="ico" id="fastReelIco"></span>快速回收</button>
    <div id="hint" class="hint"></div>
    <!-- 屏幕闪白（批 7）：串上「带电」鱼时短促闪一下。纯视觉，不拦任何输入。 -->
    <div id="screenFlash" class="screen-flash"></div>
    <!-- Boss 血条（批 7）：只在 Boss 在场时显示。分段刻度由 ui.setBossBar 按 BOSS.segments 生成 -->
    <div id="bossBar" class="boss-bar hidden">
      <div class="boss-name" id="bossName"></div>
      <div class="boss-track" id="bossTrack"><div class="boss-fill" id="bossFill"></div></div>
    </div>
    <!-- 深度氛围（批 6 特效 #11）：越深 vignette 越重。用 CSS 覆盖层，不引入后处理管线。 -->
    <div id="vignette" class="vignette"></div>
    <!-- 连击色差（批 6 特效 #4）：连击 ≥ 10 时屏幕边缘 RGB 分离 -->
    <div id="comboFx" class="combo-fx"></div>
    <!-- Boss 色偏（批 6 特效 #10）：Boss 在场时整个画面偏红 -->
    <div id="bossShift" class="boss-shift"></div>
    <!-- 过场卡（批 5）：进入某张图第一次时放一次，全屏黑底 + 打字机逐字。点任意处跳过。 -->
    <div id="cutscene" class="cutscene hidden">
      <div class="cut-text" id="cutText"></div>
      <div class="cut-hint" id="cutHint">点击继续</div>
    </div>
  </div>

  <!-- 手机界面：打开后是一台占满屏幕的巨大智能手机，商店 / 图鉴 / 设置都是里面的 App -->
  <div id="phoneLayer" class="phone-layer hidden">
    <div class="phone" id="phoneBody">
      <div class="phone-shell">
        <div class="p-island"></div>
        <div class="p-status">
          <span class="p-time" id="pTime">9:41</span>
          <span class="p-sys">
            <i class="p-slot" id="pSig"></i>
            <i class="p-slot" id="pWifi"></i>
            <i class="p-slot" id="pBat"></i>
          </span>
        </div>
        <div class="p-body">
          <div class="p-home" id="pHome"></div>
          <div class="p-app hidden" id="pApp"></div>
        </div>
        <!-- 这里原来有一条常驻 Dock（「抛竿」按钮），已移除：手机里不再有抛竿入口。
             抛竿的唯一入口是**收起手机后点游戏画面**（见 README「两个交互细节」）。 -->
        <div class="p-bar"></div>
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay hidden"></div>
</div>

<script type="module" src="./src/game.js"></script>
</body>
</html>
